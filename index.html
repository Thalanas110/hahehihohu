<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainy Verses</title>
    <link rel="stylesheet" href="css/rain.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Background Effect -->
    <div class="rain-container" id="rain"></div>

    <div class="container">
        <header>
            <h1 class="main-title">Good evening, my dear baby</h1> <!-- Custom title from ref or generic -->
            <p class="subtitle">Click on a poem to view.</p>
        </header>

        <div class="controls">
            <div class="search-container">
                <input type="text" id="search-input" class="search-input"
                    placeholder="Search poems by title or theme...">
            </div>

            <div class="filter-container" id="filter-container">
                <button class="filter-btn active" data-filter="all">All</button>
                <!-- Filters injected via JS -->
            </div>
        </div>

        <section class="poem-grid" id="poem-grid">
            <!-- Poems will be injected here -->
        </section>
    </div>

    <!-- Modal Structure -->
    <div class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn">&times;</button>
            <h2 class="modal-title"></h2>
            <div class="modal-body"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
</body>

</html>
